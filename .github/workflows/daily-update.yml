name: Daily disposable list update

# Pulls upstream community lists, normalises them, diffs against
# data/domains.txt, and opens a PR if anything changed.
#
# Triggered nightly by cron and on demand via `workflow_dispatch`.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install update dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch upstream sources
        run: |
          set -euo pipefail
          mkdir -p .upstream
          curl -fsSL https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/master/disposable_email_blocklist.conf \
            -o .upstream/disposable-email-domains.txt
          curl -fsSL https://raw.githubusercontent.com/FGRibreau/mailchecker/master/list.txt \
            -o .upstream/mailchecker.txt

      - name: Normalize and merge
        run: |
          set -euo pipefail
          python3 scripts/merge_upstream.py \
            --input .upstream/disposable-email-domains.txt .upstream/mailchecker.txt \
            --existing data/domains.txt \
            --exceptions data/exceptions.txt \
            --output data/domains.txt

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/domains.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/domains.txt
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/daily-disposable-update
          title: "chore: daily disposable list update"
          commit-message: "chore: daily disposable list update"
          body: |
            Automated daily refresh of `data/domains.txt` from upstream community lists.

            Reviewer checklist:
            - [ ] All changes are additions (removals require human review — see CONTRIBUTING.md).
            - [ ] CI is green.
          delete-branch: true
